  completion_menu_current_bg: "#2b2b2b"
  completion_menu_meta_bg: "#2a2d2e"
  completion_menu_meta_current_bg: "#2b2b2b"
  diff_added: "#213224"
  diff_removed: "#4a2927"
  diff_added_word: "#2ea043"
  diff_removed_word: "#f85149"
  syntax_string: "#2ea043"
  syntax_number: "#c586c0"
  syntax_keyword: "#4ec9b0"
  syntax_comment: "#6e7681"

branding:
  agent_name: Ginb
  response_label: " ▸ Ginb "
  prompt_symbol: "▸"
  help_header: "▸ Ginb Build Commands"
  welcome: "Ginb builder ready. Type /help for commands."
  goodbye: "Ginb build session closed."

spinner:
  waiting_faces: ["▹", "▸", "◆"]
  thinking_faces: ["▹", "▸", "◆"]
  thinking_verbs:
    - inspecting code
    - building change
    - running checks
    - verifying delivery

