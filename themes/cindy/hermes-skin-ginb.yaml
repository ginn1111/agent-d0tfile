  banner_accent: "#4ec9b0"
  banner_title: "#4ec9b0"
  banner_text: "#cccccc"
  banner_dim: "#6e7681"
  banner_border: "#2b2b2b"
  ui_text: "#cccccc"
  ui_border: "#2b2b2b"
  ui_ok: "#2ea043"
  ui_warn: "#cca700"
  ui_error: "#f85149"
  prompt: "#4ec9b0"
  input_rule: "#2b2b2b"
  response_border: "#4ec9b0"
  status_bar_bg: "#181818"
  status_bar_text: "#9d9d9d"
  status_bar_strong: "#4ec9b0"
  status_bar_dim: "#6e7681"
  status_bar_good: "#2ea043"
  status_bar_warn: "#dcdcaa"
  status_bar_bad: "#cca700"
  status_bar_critical: "#f85149"
  session_label: "#4ec9b0"
