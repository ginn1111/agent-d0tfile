# Cindy VS Code Dark Modern (themes/cindy/vscode-dark-modern.palette); managed by `make theme-cindy`.
[theme.custom]
panel_bg = "#1f1f1f"       # bg
surface0 = "#2a2d2e"       # surface
surface1 = "#2b2b2b"       # rule
surface_dim = "#181818"    # bg_alt
active_row_bg = "#181818"  # bar
selection_bg = "#2b2b2b"   # rule
overlay0 = "#5a5a5a"       # ghost
overlay1 = "#6e7681"       # dim
text = "#cccccc"           # fg
subtext0 = "#9d9d9d"       # sub
mauve = "#c586c0"          # purple
accent = "#0078d4"         # accent
green = "#2ea043"          # ok
yellow = "#dcdcaa"         # yellow
red = "#f85149"            # err
blue = "#3794ff"           # info
teal = "#4ec9b0"           # turquoise
peach = "#cca700"          # warn
