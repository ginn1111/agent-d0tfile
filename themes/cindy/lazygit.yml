# Cindy VS Code Dark Modern (themes/cindy/vscode-dark-modern.palette); installed by `make theme-cindy`.
gui:
  border: rounded # slight rounded panels (matches desktop corner-radius)
  theme:
    activeBorderColor: ["#0078d4", bold]
    inactiveBorderColor: ["#5a5a5a"]
    searchingActiveBorderColor: ["#dcdcaa", bold]
    optionsTextColor: ["#3794ff"]
    selectedLineBgColor: ["#2b2b2b"]
    inactiveViewSelectedLineBgColor: ["#2a2d2e"]
    cherryPickedCommitFgColor: ["#c586c0"]
    cherryPickedCommitBgColor: ["#2a2d2e"]
    markedBaseCommitFgColor: ["#3794ff"]
    markedBaseCommitBgColor: ["#dcdcaa"]
    unstagedChangesColor: ["#f85149"]
    defaultFgColor: ["#cccccc"]
