  syntax_string: "#9d9d9d"
  syntax_number: "#cccccc"
  syntax_keyword: "#4daafc"
  syntax_comment: "#6e7681"

branding:
  agent_name: Cindy
  response_label: " ◇ Cindy "
  prompt_symbol: "◇"
  help_header: "◇ Cindy Command Palette"
  welcome: "Cindy secretary ready. Type /help for commands."
