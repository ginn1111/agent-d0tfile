  ui_text: "#cccccc"
  ui_border: "#2b2b2b"
  ui_ok: "#2ea043"
  ui_warn: "#cca700"
  ui_error: "#f85149"
  prompt: "#4daafc"
  input_rule: "#2b2b2b"
  response_border: "#0078d4"
  status_bar_bg: "#181818"
  status_bar_text: "#9d9d9d"
  status_bar_strong: "#4daafc"
  status_bar_dim: "#6e7681"
