<!doctype html>
<html><head><meta charset="utf-8"><title>Cindy · red-syntax</title>
<link rel="stylesheet" href="../themes/base.css">
<style>
:root { --bg:#001419; --text:#9eabac; --text-bright:#adb7b7; --dim:#576d74; --brand:#db302d;
  --accent:#db302d; --accent2:#ede7d3; --err:#f55350;
  --chrome-bg:#002c38; --side-bg:#002c38; --border:#063540;
  --tab-on-bg:#db302d; --tab-on-fg:#fdf5e2; --focus:#db302d; --focus-glow:#570f0e;
  --sel-bg:#063540; --cursorline:#002c38; --nr-cur:#db302d; --search-bg:#b7211f;
  --mode-n:#db302d; --mode-i:#ede7d3; --mode-v:#b7211f; --mode-c:#637981; --mode:var(--mode-n); --fname:#db302d;
  --cwd:#db302d; --dir:#adb7b7; --hov-bg:#063540; --marker:#db302d; --ymode-bg:#db302d; --ymode-sel:#b7211f; --prompt:#db302d; }
body.ysel { --ymode-bg: var(--ymode-sel); }
.lualine,.yazi .status{background:#002c38} .yazi .ymode2{background:#063540}
.shell .prompt-dir{color:#adb7b7}
.c-green{color:#db302d}.c-blue{color:#adb7b7}.c-cyan{color:#ede7d3}.c-orange{color:#f55350}.c-yellow{color:#637981}.code .hit{color:#fdf5e2}
.sig-ok{color:#849900!important} .sig-warn{color:#b28500!important}
</style></head>
<body><script src="../themes/mock.js"></script>
<script>
document.querySelectorAll('.agents .row span, .status span, .lualine span').forEach(e => {
  const t = e.textContent.trim();
  if (/^(idle|● 3 agents|\+12)$/.test(t)) e.classList.add('sig-ok');
  if (/^(run|▲ 1 warn|W2|~3)$/.test(t)) e.classList.add('sig-warn');
});
</script></body></html>
