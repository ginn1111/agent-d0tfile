services:
  9router:
    env_file:
      - .env
    container_name: 9router
    image: decolua/9router
    ports:
      - 20128:20128
    restart: unless-stopped
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared
    command: tunnel --no-autoupdate run --token ${CF_TOKEN}
    network_mode: host
